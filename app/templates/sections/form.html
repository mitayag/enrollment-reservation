{% extends "base.html" %}
{% block title %}{{ 'Edit' if section else 'Add' }} section — {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">{{ 'Edit section' if section else 'Add section' }}</h1>
    {% if errors %}
    <div class="alert alert-danger"><ul class="mb-0">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>
    {% endif %}
    <div class="card">
      <div class="card-body">
        <form method="post" action="{{ '/sections/%s/edit'|format(section.id) if section else '/sections/new' }}">
          <input type="hidden" name="_csrf" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label" for="name">Section name</label>
            <input class="form-control" id="name" name="name" maxlength="100" required
                   value="{{ form.name if form is defined and form else (section.name if section else '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label" for="year_level">Year level</label>
            <select class="form-select" id="year_level" name="year_level" required>
              {% set current_yl = form.year_level if form is defined and form else (section.year_level if section else none) %}
              {% for yl in [1, 2, 3, 4] %}
              <option value="{{ yl }}" {{ 'selected' if current_yl == yl else '' }}>{{ yl }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" href="/sections">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
